<ion-content class="ion-padding">
  <desyi-text variant="heading-medium">Favoritos</desyi-text>
  <desyi-text variant="body">
    Marca los accesos que quieres mantener a mano. La selección se guarda en
    memoria mientras la app esté abierta.
  </desyi-text>

  @if (items().length === 0) {
    <app-empty-state
      icon="heart-outline"
      title="Aún no tienes favoritos"
    ></app-empty-state>
  } @else {
    <div class="favorites-list">
      @for (item of items(); track item.id) {
        <div class="favorite-item">
          <desyi-checkbox
            [checked]="isChecked(item.id)"
            [text]="item.title"
            [value]="item.id"
            name="favorites-checkbox"
            (change)="toggle(item.id, $event)"
          ></desyi-checkbox>
          <ion-item lines="none">
            <ion-label>
              <p>{{ item.description }}</p>
            </ion-label>
          </ion-item>
        </div>
      }
    </div>
  }
</ion-content>
