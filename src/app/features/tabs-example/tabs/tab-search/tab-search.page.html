<ion-content class="ion-padding">
  <desyi-searchbar
    [placeholder]="'Busca un trámite, ayuda o cita…'"
    (onInputEmit)="onSearchEvent($event)"
  ></desyi-searchbar>

  @if (filtered().length === 0) {
    <app-empty-state
      icon="search-outline"
      title="Sin resultados"
      description="No hemos encontrado nada para '{{ query() }}'. Prueba con otra palabra."
    ></app-empty-state>
  } @else {
    <ion-list>
      @for (item of filtered(); track item.id) {
        <ion-item>
          <ion-label>
            <h2>{{ item.name }}</h2>
            <ion-note>{{ item.category }}</ion-note>
          </ion-label>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
