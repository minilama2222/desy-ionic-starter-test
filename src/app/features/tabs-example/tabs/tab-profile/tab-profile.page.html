<ion-content class="ion-padding">
  <div class="profile">
    <desyi-icon [iconName]="icon" size="large" color="primary"></desyi-icon>
    <desyi-text headingLevel="c-h2" [text]="user.name"></desyi-text>
    <p>{{ user.email }}</p>
    <ion-note>{{ user.role }}</ion-note>

    <desyi-button
      text="Cerrar sesión"
      icon="log-out-outline"
      iconSlot="start"
      [classes]="'c-button--secondary'"
      (onClickEmit)="signOut()"
    ></desyi-button>
  </div>
</ion-content>
